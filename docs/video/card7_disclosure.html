<!doctype html>
<meta charset="utf-8"><title>Card 7 — Disclosure</title>
<style>
  :root{--text:#E6EDF3;--muted:#6E7681;--bg:#0D1117;}
  html,body{margin:0;background:var(--bg)}
  #fit{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;background:var(--bg);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    transform:scale(var(--s,1));transform-origin:center}
  .abs{position:absolute}

  /* Value and label are separate boxes so the label sits at a fixed Y+110
     regardless of how tall the numeral renders. */
  .val{font-size:88px;line-height:1;color:var(--text);font-weight:600;
       letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .lab{font-size:24px;line-height:1;color:var(--muted);letter-spacing:.2em;
       font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  #footer{left:160px;top:860px;font-size:26px;color:var(--muted)}

  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .blk{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
  :target ~ #fit .blk{animation:none;opacity:1;transform:none}
</style>
<span id="end"></span>
<div id="fit"><div id="stage">
  <div id="blocks"></div>
  <div class="abs" id="footer">Scored path runs on the Python standard library alone.</div>
</div></div>
<script>
  // value, label, X, Y  — 2x2 at X 160/1000, Y 320/600.
  // The 0 and the $0.00 are the claim of this card; they stay at 88px.
  const BLOCKS=[
    ["0",      "TOKENS USED",      160, 320],
    ["$0.00",  "MODEL COST",      1000, 320],
    ["24ms",   "MEDIAN PER TURN",  160, 600],
    ["198",    "TESTS PASSING",   1000, 600],
  ];
  const host=document.getElementById('blocks');
  BLOCKS.forEach(([v,l,x,y],i)=>{
    const add=(cls,txt,dy)=>{
      const d=document.createElement('div');
      d.className='abs blk '+cls;
      d.style.left=x+'px'; d.style.top=(y+dy)+'px';
      d.style.animationDelay=(0.12+i*0.10)+'s';
      d.textContent=txt; host.appendChild(d);
    };
    add('val',v,0); add('lab',l,110);
  });
  const fit=()=>document.getElementById('stage').style
    .setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080));
  fit(); addEventListener('resize',fit);
</script>
