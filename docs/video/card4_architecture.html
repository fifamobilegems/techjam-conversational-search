<!doctype html>
<meta charset="utf-8">
<title>Card 4 — Architecture</title>
<style>
  /* 1920x1080 stage. Coordinates below are literal from the card spec. */
  :root{
    --amber:#D29922;   /* headers            */
    --text:#E6EDF3;    /* body               */
    --muted:#6E7681;   /* footer             */
    --rule:#21262D;    /* hairline under head */
    --bg:#0D1117;      /* GitHub dark ground  */
  }
  html,body{margin:0;background:var(--bg);}
  /* Scales the 1920x1080 stage to fit whatever window records it. */
  #fit{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;}
  #stage{
    position:relative;width:1920px;height:1080px;background:var(--bg);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    transform:scale(var(--s,1));transform-origin:center;
  }
  .col{position:absolute;width:480px;}
  .col:nth-child(1){left:160px}
  .col:nth-child(2){left:700px}
  .col:nth-child(3){left:1240px}

  .head{
    position:absolute;top:260px;left:0;
    font-size:24px;line-height:1;color:var(--amber);
    letter-spacing:.2em;               /* tracking 200 */
    font-weight:600;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .rule{position:absolute;top:300px;left:0;width:480px;height:1px;background:var(--rule);}
  .body{
    position:absolute;top:340px;left:0;width:480px;
    font-size:28px;line-height:1.6;color:var(--text);
  }
  .body div + div{margin-top:.55em}

  .footer{
    position:absolute;left:160px;top:780px;
    font-size:26px;line-height:1.6;color:var(--muted);
  }

  /* Rise + Slow. Staggered left to right, matching data flow. */
  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .col,.footer{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards;}
  .col:nth-child(1){animation-delay:.10s}
  .col:nth-child(2){animation-delay:.32s}
  .col:nth-child(3){animation-delay:.54s}
  .footer{animation-delay:1.00s}
  /* #end freezes the finished frame, for stills */
  :target ~ #fit .col, :target ~ #fit .footer{animation:none;opacity:1;transform:none}
</style>
<span id="end"></span>
<div id="fit"><div id="stage">

  <div class="col">
    <div class="head">01 EXTRACT</div><div class="rule"></div>
    <div class="body">
      <div>Template match</div>
      <div>Catalog lexicon</div>
      <div>Optional LLM</div>
    </div>
  </div>

  <div class="col">
    <div class="head">02 REMEMBER</div><div class="rule"></div>
    <div class="body">
      <div>Append-only<br>event log</div>
      <div>Replay, never<br>mutate</div>
    </div>
  </div>

  <div class="col">
    <div class="head">03 RANK</div><div class="rule"></div>
    <div class="body">
      <div>BM25 / FTS5</div>
      <div>Hard-constraint gate</div>
      <div>Four ordered stages</div>
    </div>
  </div>

  <div class="footer">
    Recall@500 on turn one: 0.833.<br>
    Finding the product was never the hard part.
  </div>

</div></div>
<script>
  // Fit the fixed 1920x1080 stage to the window so it records cleanly at any size.
  const fit=()=>document.getElementById('stage').style.setProperty('--s',
    Math.min(innerWidth/1920, innerHeight/1080));
  fit(); addEventListener('resize', fit);
</script>
