<!doctype html>
<meta charset="utf-8"><title>Card 4b — Three answers</title>
<style>
  :root{--text:#E6EDF3;--muted:#6E7681;--rule:#21262D;--bg:#0D1117;
        --signal:#3FB950;--amber:#D29922;}
  html,body{margin:0;background:var(--bg)}
  #fit{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;background:var(--bg);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    transform:scale(var(--s,1));transform-origin:center}
  .abs{position:absolute}
  #title{left:160px;top:220px;font-size:34px;color:var(--muted)}

  /* Three states, each in its own box so the words sit on a shared baseline
     regardless of length. Mono: these are code states, not prose. */
  .word{top:380px;font-size:72px;line-height:1;text-align:left;font-weight:600;
        letter-spacing:.02em;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #w1{left:160px;width:500px;color:var(--signal)}
  #w2{left:700px;width:500px;color:var(--amber)}
  #w3{left:1240px;width:520px;color:var(--muted)}

  #rule{left:160px;top:500px;width:1600px;height:1px;background:var(--rule)}

  #coverage{left:160px;top:560px;font-size:28px;line-height:1.6;color:var(--muted);
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #coverage .k{display:inline-block;width:420px}

  #footer{left:160px;top:760px;font-size:30px;color:var(--text)}

  /* Fade, together. They are one three-state idea, not a list of three items,
     so a stagger would read as sequence where none exists. */
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .word{opacity:0;animation:fade .9s cubic-bezier(.16,1,.3,1) .25s forwards}
  :target ~ #fit .word{animation:none;opacity:1}
</style>
<span id="end"></span>
<div id="fit"><div id="stage">

  <div class="abs" id="title">Every hard check has three answers.</div>

  <div class="abs word" id="w1">SATISFIED</div>
  <div class="abs word" id="w2">VIOLATED</div>
  <div class="abs word" id="w3">UNKNOWN</div>

  <div class="abs" id="rule"></div>

  <div class="abs" id="coverage">
    <div><span class="k">details.Color</span>4.9% of catalog</div>
    <div><span class="k">details.Material</span>4.1% of catalog</div>
  </div>

  <div class="abs" id="footer">Only VIOLATED counts against you. Absent is not a mismatch.</div>

</div></div>
<script>
  const fit=()=>document.getElementById('stage').style
    .setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080));
  fit(); addEventListener('resize',fit);
</script>
